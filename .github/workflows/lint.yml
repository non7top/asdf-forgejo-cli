name: forgejo-cli Lint

on:
  pull_request:
    branches: [master]
  push:
    branches: [master]

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: asdf-vm/actions/install@v4
      - run: scripts/lint.bash

  actions-lint:
    uses: non7top/gh-workflows/.github/workflows/actions-lint.yml@main
    permissions:
      contents: read
